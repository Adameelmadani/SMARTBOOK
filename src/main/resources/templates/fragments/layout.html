<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">SmartBook</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <header th:fragment="public-nav(activePage)">
        <nav class="navbar navbar-expand-lg navbar-dark glass-nav">
            <div class="container">
                <a class="navbar-brand" href="/">SmartBook</a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#publicNavbarNav" aria-controls="publicNavbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="publicNavbarNav">
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item" th:classappend="${activePage == 'signin'} ? ' active'">
                            <a class="nav-link" href="/signin">Sign In</a>
                        </li>
                        <li class="nav-item" th:classappend="${activePage == 'signup'} ? ' active'">
                            <a class="nav-link" href="/signup">Sign Up</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <header th:fragment="app-nav(activePage, user)">
        <nav class="navbar navbar-expand-lg navbar-dark glass-nav">
            <div class="container">
                <a class="navbar-brand" href="/dashboard">SmartBook</a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#appNavbarNav" aria-controls="appNavbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="appNavbarNav">
                    <ul class="navbar-nav mr-auto">
                        <li class="nav-item" th:classappend="${activePage == 'dashboard'} ? ' active'">
                            <a class="nav-link" href="/dashboard">My Books</a>
                        </li>
                        <li class="nav-item" th:classappend="${activePage == 'discover'} ? ' active'">
                            <a class="nav-link" href="/discover">Discover</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav ml-auto" th:if="${user != null}">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                <span th:text="${user.username}">Username</span>
                            </a>
                            <div class="dropdown-menu">
                                <a class="dropdown-item" href="/profile">Profile</a>
                                <div class="dropdown-divider"></div>
                                <a class="dropdown-item" href="/logout">Sign Out</a>
                            </div>
                        </li>
                    </ul>
                    <div class="ml-auto" th:if="${user == null}">
                        <a class="btn btn-outline-light btn-sm mr-2" href="/signin">Sign In</a>
                        <a class="btn btn-light btn-sm" href="/signup">Sign Up</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <footer class="footer-bar py-4" th:fragment="footer">
        <div class="container text-center">
            <p>&copy; 2023 SmartBook. All rights reserved.</p>
        </div>
    </footer>

    <th:block th:fragment="scripts(includeIcons)">
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
        <script th:if="${includeIcons}" src="https://kit.fontawesome.com/a076d05399.js"></script>
    </th:block>
</body>
</html>
