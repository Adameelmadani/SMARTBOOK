# Server port
server.port=8080

# Database configuration
spring.datasource.url=jdbc:h2:file:./data/smartbook-db;MODE=MySQL;DATABASE_TO_UPPER=false;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File upload configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Book storage location
app.book.upload-dir=./uploads/books/

# Jackson configuration
spring.jackson.serialization.fail-on-empty-beans=false

# Thymeleaf configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# Keep the sample data enabled by default so the app runs out of the box
spring.profiles.active=dev

# H2 console for local debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console