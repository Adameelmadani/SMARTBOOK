# Server port
server.port=8080

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smartbook?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=adam
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File upload configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Book storage location
app.book.upload-dir=./uploads/books/

# Jackson configuration
spring.jackson.serialization.fail-on-empty-beans=false

# Thymeleaf configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# Add this to your existing properties
spring.profiles.active=dev